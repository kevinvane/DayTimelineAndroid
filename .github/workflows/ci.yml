name: CI

# 门禁顺序与 PRD §12.4 一致：静态检查 → 构建 → 单元测试 → 覆盖率 → 平台规范检查。
# 任何一步失败即阻断，不提供「跳过」入口——门禁的意义就在于阻断。

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # local.properties 被 gitignore，新克隆的仓库没有它（见 AGENTS.md）。
      # setup-android 会导出 ANDROID_HOME / ANDROID_SDK_ROOT，Gradle 据此定位 SDK。
      # 它默认只装 platform-tools，本工程 compileSdk 36 所需的 SDK 平台必须显式列出，
      # 否则 AGP 解析不到目标平台。另：不要再写 'tools'——Google 已下架该包，
      # sdkmanager 会 exit 1 并让整个 action 失败（v4.0.2 起的修复，v3 等不到）。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 授予 Gradle 缓存权限
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 静态代码检查 0 严重 + 代码风格 0 违规（PRD §12.4 / T6）
      # 在编译之前跑：静态问题应当最先暴露，而不是等编译完才发现
      - name: detekt
        run: ./gradlew detekt --stacktrace

      # 死代码 0 处（PRD T5 / D20）。单独一步，便于失败时一眼看出是哪条红线
      - name: 死代码门禁
        run: ./gradlew :library:verifyNoDeadCode --stacktrace

      - name: 编译组件库与示例应用
        run: ./gradlew :library:assembleDebug :app:assembleDebug --stacktrace

      - name: JVM 单元测试
        run: ./gradlew :library:testDebugUnitTest --stacktrace

      # 核心逻辑覆盖率门禁（PRD T4：≥ 90%）
      - name: 核心逻辑覆盖率门禁
        run: ./gradlew :library:verifyCoreCoverage --stacktrace

      # 可测逻辑覆盖率门禁（PRD T4：≥ 75%，口径见 PRD §12.4.1）
      - name: 可测逻辑覆盖率门禁
        run: ./gradlew :library:verifyAllCoverage --stacktrace

      # 平台规范检查（PRD T6：0 错误 0 警告）
      - name: lint
        run: ./gradlew :library:lintDebug --stacktrace

      - name: 统计测试数量
        run: |
          COUNT=$(grep -ho 'tests="[0-9]*"' library/build/test-results/testDebugUnitTest/*.xml \
            | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "单元测试总数: $COUNT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: library/build/reports/jacoco/**
          retention-days: 7

  # 仪器测试需要设备或模拟器，单独一个 job 便于按需触发
  instrumented:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # emulator-runner 用 ${ANDROID_HOME}/emulator/emulator，ANDROID_HOME 由此 action 导出；
      # 平台同上，编译侧同样需要 platforms;android-36。
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :library:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: instrumented-report
          path: library/build/reports/androidTests/**
          retention-days: 7

  # R8 / 混淆消费端验证（PRD §12.5 / T7 / 风险 R8）。
  # 单独一个 job：它验证的是「发布形态」而非源码，且耗时明显更长。
  r8-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 第一步：R8 能否跑通 + 对外契约类是否按规则保留（不需要设备）
      - name: 混淆产物构建与符号核对
        run: ./gradlew :r8test:verifyKeptSymbols --stacktrace

      # 第二步：在**混淆后的** release 变体上跑仪器测试。
      # 这是「业务方开启混淆后功能正常」的唯一有效证据——
      # library 自身不开混淆，保留规则写错也不会有任何东西报错。
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew :r8test:connectedReleaseAndroidTest

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r8-test-report
          path: r8test/build/reports/androidTests/**
          retention-days: 7
