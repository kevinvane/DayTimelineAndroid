name: CI

# 门禁顺序与 PRD §12.4 一致：静态检查 → 构建 → 单元测试 → 覆盖率 → 平台规范检查。
# 任何一步失败即阻断，不提供「跳过」入口——门禁的意义就在于阻断。

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 设置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # local.properties 被 gitignore，新克隆的仓库没有它（见 AGENTS.md）。
      # setup-android 会导出 ANDROID_HOME / ANDROID_SDK_ROOT，Gradle 据此定位 SDK。
      # 它默认只装 platform-tools，本工程 compileSdk 36 所需的 SDK 平台必须显式列出，
      # 否则 AGP 解析不到目标平台。另：不要再写 'tools'——Google 已下架该包，
      # sdkmanager 会 exit 1 并让整个 action 失败（v4.0.2 起的修复，v3 等不到）。
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: 授予 Gradle 缓存权限
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 静态代码检查 0 严重 + 代码风格 0 违规（PRD §12.4 / T6）
      # 在编译之前跑：静态问题应当最先暴露，而不是等编译完才发现
      - name: detekt
        run: ./gradlew detekt --stacktrace

      # 死代码 0 处（PRD T5 / D20）。单独一步，便于失败时一眼看出是哪条红线
      - name: 死代码门禁
        run: ./gradlew :library:verifyNoDeadCode --stacktrace

      # 网格区常驻界面元素数 = 0（PRD §12.1 / D16 / AD-01）。
      # §12.1 原文写的是「代码走查」——人工走查挡不住下一次改动：谁为了修命中测试
      # 或做无障碍焦点而往时间轴里塞一个子 View，静态检查不报、单测全绿、真机也看不出，
      # 指标却已经破了。这里把它变成机器拦截，不需要设备，秒级完成。
      - name: 常驻界面元素门禁
        run: ./gradlew :library:verifyNoChildViews --stacktrace

      # 色值须为设计定稿值（PRD §16.2 的 M6 出口硬卡点 / §18 R10）。
      # 此前该出口标准只存在于文字里，占位值可以再次混进发布物而无人拦截——
      # 这正是 R10 描述的事故形态。单独一步，便于失败时一眼看出是哪条红线。
      - name: 色值定稿门禁
        run: ./gradlew :library:verifyColorsFinalized --stacktrace

      - name: 编译组件库与示例应用
        run: ./gradlew :library:assembleDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: JVM 单元测试
        run: ./gradlew :library:testDebugUnitTest --stacktrace

      # 核心逻辑覆盖率门禁（PRD T4：≥ 90%）
      - name: 核心逻辑覆盖率门禁
        run: ./gradlew :library:verifyCoreCoverage --stacktrace

      # 可测逻辑覆盖率门禁（PRD T4：≥ 75%，口径见 PRD §12.4.1）
      - name: 可测逻辑覆盖率门禁
        run: ./gradlew :library:verifyAllCoverage --stacktrace

      # 平台规范检查（PRD T6：0 错误 0 警告）
      - name: lint
        run: ./gradlew :library:lintDebug --stacktrace

      - name: 统计测试数量
        run: |
          COUNT=$(grep -ho 'tests="[0-9]*"' library/build/test-results/testDebugUnitTest/*.xml \
            | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "单元测试总数: $COUNT"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: library/build/reports/jacoco/**
          retention-days: 7

  # 仪器测试需要设备或模拟器，单独一个 job 便于按需触发
  instrumented:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # emulator-runner 用 ${ANDROID_HOME}/emulator/emulator，ANDROID_HOME 由此 action 导出；
      # 平台同上，编译侧同样需要 platforms;android-36。
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Gradle 缓存：与静态门禁 job 用同一套 key，可直接复用它存下的产物。
      # 此前这个 job **没有任何缓存**——日志里那句
      # `Downloading https://services.gradle.org/distributions/gradle-8.13-bin.zip`
      # 就是明证，而这段时间模拟器只能空转等着（ANR 就长在这种空转里）。
      - name: 复用 Gradle 缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      # 让 runner 用户能打开 /dev/kvm。**这一步不能省**：runner 镜像里 kvm 设备节点
      # 权限是 crw-rw---- root:kvm，而跑 workflow 的 runner 用户不在 kvm 组里，
      # open() 直接 EACCES。缺失时的表现**不是报错，而是静默降级**——
      # emulator 走到 `-accel off` 走纯软件模拟，然后 boot_completed 永远等不到：
      # 日志里是「ProbeKVM: This user doesn't have permissions to use KVM」
      # → 「Disabling Linux hardware acceleration」→ 无限「adb: device offline」。
      # 2026-10-17 CI 就因为缺这一步红过一次（两个 emulator job 都会红）。
      - name: 开放 /dev/kvm 权限（模拟器硬件加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 把上面那步的效果摆到日志里：设备不存在说明 runner 类别没给嵌套虚拟化
      # （这时无论怎么配都得不到加速），权限不对则上面那条 udev 规则没生效。
      # 少了这行，下一次同类回归又要从「device offline」反推。
      - name: 确认 KVM 可用
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # 先把两个测试 APK 编好，**再**起模拟器：模拟器的生命周期要尽量短。
      # 2026-10-17 那次失败里，模拟器 boot 完就空转等 Gradle 下载发行包 + 编译，
      # 系统在长时间饥饿下弹了 ANR 之类的系统窗口——它抢走焦点后，Espresso 的
      # 7 条用例全部报 RootViewWithoutFocusException（细节见下面 script 的注释）。
      # 编译本来就与模拟器无关，没有理由让模拟器陪着等。
      - name: 预编译测试 APK（模拟器起来之前）
        run: |
          ./gradlew :library:assembleDebug :library:assembleDebugAndroidTest \
            :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          # 钉住设备档位。**不写就用 AVD 默认档**——那是 320×480 / mdpi，
          # 而 `MainActivityCancelPathTest` 的几何注释（表单一屏放得下、可见面积 90%）
          # 是按高密度手机写的；本仓库已经因为「设备几何的隐含前提」红过一次
          # （质量报告 §4.3 的密度矩阵）。由日志推算：详情弹窗宽度 `(256xwrap)`
          # 正是屏幕宽 × 0.8（`EventDetailPopup.MAX_WIDTH_RATIO`）⇒ 屏宽 320px。
          # `pixel_2` 是 1080×1920 / 420dpi，与本地验证过那台 Pixel_XL_API_34 同档。
          profile: pixel_2
          # 显式写全 emulator 参数：一是把默认值钉住（默认值是 action 的隐含前提，
          # 与「测试套件写死像素几何」是同一类坑），二是加 -no-metrics——
          # 当前只是一行 WARNING，但 release note 已写明后续版本会变成阻塞式询问，
          # 那时这条 CI 会毫无征兆地卡住。
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          # :app 也要跑：组件库测的是「组件自己不误发数据变更」，
          # demo 测的是「业务方接了 EditController 之后收不收得干净」——
          # BottomSheet / PopupWindow 的 onDismiss 收尾写在 demo 侧，不在组件里。
          # 组件测试绿而 demo 这条链路断掉的情况是真实发生过的。
          script: |
            set -u
            # 设备状态准备：屏幕必须醒着、且没有锁屏，否则**应用窗口拿不到焦点**。
            # 焦点是 Espresso 的硬前提（`Root.isReady()` 要求 `hasWindowFocus`，
            # 等待上限硬编码 10 秒、不可配置）——2026-10-17 那 7 条用例全是这么红的。
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell svc power stayon true || true
            adb shell wm dismiss-keyguard || true

            if ./gradlew :library:connectedDebugAndroidTest :app:connectedDebugAndroidTest; then
              exit 0
            fi

            # 失败时才取证。**必须在这里做**：action 结束即销毁模拟器，
            # 后续 workflow step 里 adb 已经没有设备可查。
            # 2026-10-17 那 7 条 RootViewWithoutFocusException 的日志里只有一个
            # `has-window-focus=false` 的根，看不出是谁抢走了焦点——
            # 是系统 ANR 弹窗、锁屏、还是熄屏，全靠这几十秒输出区分。
            echo "::group::失败时的设备状态（焦点窗口 / 熄屏 / ANR）"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb shell dumpsys power | grep -E 'mWakefulness|mHoldingDisplaySuspendBlocker' || true
            adb shell dumpsys activity | grep -E 'mFocusedActivity|ANR' || true
            adb logcat -d -v brief | grep -iE 'ANR in|not responding' | tail -40 || true
            echo "::endgroup::"
            exit 1
      - name: 失败用例明细
        if: failure()
        run: |
          xmls=$(find . -path '*/build/outputs/androidTest-results/connected/*/TEST-*.xml')
          if [ -z "$xmls" ]; then
            echo "未找到 androidTest XML 报告——测试可能未启动即失败，请看上方日志"
          else
            echo "$xmls" | while IFS= read -r f; do
              echo "::group::$f"
              python3 -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter('testcase'))
          bad = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          print('用例总数 %d，失败 %d' % (len(cases), len(bad)))
          for c in bad:
              node = c.find('failure') if c.find('failure') is not None else c.find('error')
              print('--- FAIL %s.%s' % (c.get('classname'), c.get('name')))
              print((node.text or node.get('message') or '').strip()[:3000])
          " "$f"
              echo "::endgroup::"
            done
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: instrumented-report
          path: |
            library/build/reports/androidTests/**
            app/build/reports/androidTests/**
          retention-days: 7

  # 依赖漏洞扫描（PRD §12.4「已知安全漏洞 0 个高危」）。
  # 单独一个 job：NVD 漏洞库有几百 MB，且下载有网络限速，
  # 混进静态门禁 job 会拖慢每次 CI、甚至拖到超时。独立后互不影响。
  dependency-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 漏洞库缓存。首次运行要下整库（NVD 对无 key 的请求限速很严），
      # 之后只做增量——**没有这一步，每次 CI 都要重下几百 MB**。
      - name: 缓存 NVD 漏洞库
        uses: actions/cache@v4
        with:
          path: .gradle/dependency-check-cache
          key: nvd-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # NVD_API_KEY 是仓库 secret，需维护者在 Settings → Secrets 里配置一个
      # 免费 key（https://nvd.nist.gov/developers/request-an-api-key）。
      # **没有它这道门禁依然会跑并阻断**，只是首次同步会慢很多。
      - name: 依赖漏洞门禁
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew verifyNoHighVulns --stacktrace

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-check-report
          path: build/reports/dependency-check/**
          retention-days: 7

      - name: 失败时打印漏洞明细
        if: failure()
        run: |
          report=$(find . -path '*reports/dependency-check*' -name 'dependency-check-report.json' | head -1)
          if [ -z "$report" ]; then
            echo "未找到漏洞报告 JSON——扫描可能未启动即失败，请看上方日志"
          else
            python3 -c "
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          for dep in data.get('dependencies', []):
          vulns = [v for v in dep.get('vulnerabilities', [])]
          high = [v for v in vulns if float(v.get('cvssv3', {}).get('baseScore') or v.get('cvssv2', {}).get('baseScore') or 0) >= 7.0]
          if high:
          print('%s:%s  —— %d 个 CVSS≥7.0' % (dep.get('fileName'), dep.get('filePath'), len(high)))
          for v in high:
          print('    %s  %s' % (v.get('name'), (v.get('description') or '')[:200]))
          " "$report"
          fi

  # R8 / 混淆消费端验证（PRD §12.5 / T7 / 风险 R8）。
  # 单独一个 job：它验证的是「发布形态」而非源码，且耗时明显更长。
  r8-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # 同 instrumented job：不开放 /dev/kvm，emulator 会静默走 -accel off，
      # 最终以「adb: device offline」耗尽超时收场。
      - name: 开放 /dev/kvm 权限（模拟器硬件加速）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 确认 KVM 可用
        run: |
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # 第一步：R8 能否跑通 + 对外契约类是否按规则保留（不需要设备）
      - name: 混淆产物构建与符号核对
        run: ./gradlew :r8test:verifyKeptSymbols --stacktrace

      # 第二步：在**混淆后的** release 变体上跑仪器测试。
      # 这是「业务方开启混淆后功能正常」的唯一有效证据——
      # library 自身不开混淆，保留规则写错也不会有任何东西报错。
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: ./gradlew :r8test:connectedReleaseAndroidTest

      - name: 失败用例明细
        if: failure()
        run: |
          xmls=$(find . -path '*/build/outputs/androidTest-results/connected/*/TEST-*.xml')
          if [ -z "$xmls" ]; then
            echo "未找到 androidTest XML 报告——测试可能未启动即失败，请看上方日志"
          else
            echo "$xmls" | while IFS= read -r f; do
              echo "::group::$f"
              python3 -c "
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter('testcase'))
          bad = [c for c in cases if c.find('failure') is not None or c.find('error') is not None]
          print('用例总数 %d，失败 %d' % (len(cases), len(bad)))
          for c in bad:
              node = c.find('failure') if c.find('failure') is not None else c.find('error')
              print('--- FAIL %s.%s' % (c.get('classname'), c.get('name')))
              print((node.text or node.get('message') or '').strip()[:3000])
          " "$f"
              echo "::endgroup::"
            done
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: r8-test-report
          path: r8test/build/reports/androidTests/**
          retention-days: 7
